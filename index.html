<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NILS TUFFHETSMÄTARE – ULTIMATE EDITION</title>
    <style>
        /* --- BASSTIL & COOOLT MÖRKT TEMA --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Impact', 'Arial Black', sans-serif;
            letter-spacing: 1px;
        }

        body {
            background-color: #0b0b0b;
            background-image: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            color: #eeeeee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: linear-gradient(135deg, #1f1f1f 0%, #111111 100%);
            border: 4px solid #333;
            border-image: linear-gradient(to bottom, #ff4500, #333) 1;
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.2);
            padding: 40px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 10px #ff4500, 0 0 20px #ff8c00;
            text-transform: uppercase;
            margin-bottom: 30px;
            transform: skewX(-5deg);
        }

        h2 {
            color: #ff8c00;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        p {
            font-family: 'Arial', sans-serif;
            color: #bbb;
            margin-bottom: 20px;
        }

        /* --- SESSIONS-HANTERING (LOGIN) --- */
        .hidden {
            display: none !important;
        }

        input[type="text"] {
            background-color: #222;
            border: 2px solid #ff4500;
            color: #fff;
            padding: 12px 20px;
            font-size: 1.2rem;
            text-align: center;
            width: 80%;
            margin-bottom: 20px;
            text-transform: uppercase;
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px #ff4500;
        }

        /* --- KNAPPAR (STÅL OCH ELD) --- */
        .btn {
            background: linear-gradient(to bottom, #ff5722, #bf360c);
            border: 2px solid #ff8c00;
            color: white;
            padding: 15px 40px;
            font-size: 1.5rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 5px 0 #5d1a05, 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            display: inline-block;
        }

        .btn:hover {
            background: linear-gradient(to bottom, #ff7043, #d84315);
            box-shadow: 0 5px 0 #5d1a05, 0 0 20px #ff4500;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #5d1a05, 0 3px 10px rgba(0,0,0,0.5);
        }

        /* --- RÖSTNINGSSKALA (1-10) --- */
        .rating-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .rating-dot {
            width: 45px;
            height: 45px;
            background: #252525;
            border: 2px solid #444;
            color: #888;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        }

        .rating-dot:hover {
            background: #ff4500;
            color: #fff;
            border-color: #ff8c00;
            transform: scale(1.1);
        }

        .rating-dot.selected {
            background: linear-gradient(135deg, #ff8c00, #ff4500);
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 15px #ff4500;
            font-size: 1.4rem;
        }
